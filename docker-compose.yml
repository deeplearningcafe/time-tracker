services:
  time-tracker:
    build:
      context: .
      args:
        - VITE_API_ENDPOINT=http://127.0.0.1:8000/api
    container_name: time-tracker
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persist the SQLite database
      - ./data:/app/data
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-generate_a_very_secure_random_string_here_for_prod}

      - ALLOWED_HOSTS=localhost,127.0.0.1
      - CSRF_TRUSTED_ORIGINS=http://localhost:8000

      - DB_PATH=/app/data/db.sqlite3
